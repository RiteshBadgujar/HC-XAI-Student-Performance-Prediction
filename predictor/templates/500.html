{% extends "predictor/base.html" %}
{% block title %}Server Error · HC-XAI{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center text-center py-5">
    <div class="action-icon mb-4" style="width: 72px; height: 72px; font-size: 2rem; background: var(--hc-danger-bg); color: var(--hc-danger-text);">
        <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h2 class="mb-2">Something went wrong</h2>
    <p class="text-muted mb-4" style="max-width: 420px;">
        An unexpected error occurred on our end. Please try again, or head back to the dashboard.
    </p>
    <a href="{% url 'dashboard' %}" class="btn btn-primary px-4">
        <i class="bi bi-house me-1"></i> Back to dashboard
    </a>
</div>
{% endblock %}
